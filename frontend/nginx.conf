server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker can assign a new IP address whenever the backend is recreated.
    # Resolve the service name at request time so the UI never keeps proxying
    # API calls to the old, stopped container address.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $bdcrm_backend bdcrm-api:8000;

    location /api/ {
        # With a variable upstream nginx does not automatically append the
        # matched URI suffix.  Forward the full original request so actions
        # such as /activity-planners/<id>/assign_members/ keep their path.
        proxy_pass http://$bdcrm_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://$bdcrm_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://$bdcrm_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

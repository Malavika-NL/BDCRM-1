services:
  backend:
    build:
      context: ./BDCRM/bdcrm
      dockerfile: Dockerfile
    container_name: bdcrm_backend
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://192.168.1.94:8003,http://127.0.0.1:8003,http://localhost:8003}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://192.168.1.94:8003,http://127.0.0.1:8003,http://localhost:8003}
      # PostgreSQL is hosted on the Windows machine, not in the db service below.
      POSTGRES_DB: ${POSTGRES_DB:-BDCRM}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_NAME: ${POSTGRES_DB:-BDCRM}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${POSTGRES_HOST:-host.docker.internal}
      DATABASE_PORT: ${POSTGRES_PORT:-5432}
      CONTACTS_DATABASE_NAME: ${POSTGRES_DB:-BDCRM}
      CONTACTS_DATABASE_USER: ${POSTGRES_USER:-postgres}
      CONTACTS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CONTACTS_DATABASE_HOST: ${POSTGRES_HOST:-host.docker.internal}
      CONTACTS_DATABASE_PORT: ${POSTGRES_PORT:-5432}
      CONTACT_SYNC_SOURCE: bdcrm
      CONTACT_SYNC_TARGET_URL: ${CONTACT_SYNC_TARGET_URL:-http://host.docker.internal:8003/api/integrations/sync/contact/}
      CONTACT_SYNC_TARGET_URLS: ${CONTACT_SYNC_TARGET_URLS:-http://host.docker.internal:8003/api/integrations/sync/contact/,http://host.docker.internal:8001/api/integrations/sync/contact/}
      # Planner assignments belong in Marketing CRM's telemarketing queue,
      # not this BDCRM API.  Port 8003 is BDCRM itself and has no receiver
      # for this endpoint.
      CONTACT_ASSIGNMENT_SYNC_TARGET_URLS: ${CONTACT_ASSIGNMENT_SYNC_TARGET_URLS:-http://host.docker.internal:8000/api/integrations/sync/tele-assignment/}
      # Use the same value in Marketing CRM and SalesPie.
      CONTACT_SYNC_API_TOKEN: ${CONTACT_SYNC_API_TOKEN:-bdcrm-contact-sync-local}
      # Shared-token contact sync needs an explicit BDCRM tenant because it
      # does not carry a portal JWT.
      CONTACT_SYNC_TENANT_COMPANY_ID: ${CONTACT_SYNC_TENANT_COMPANY_ID:-1}
      CONTACT_SYNC_TIMEOUT_SECONDS: ${CONTACT_SYNC_TIMEOUT_SECONDS:-5}
      WISHLIST_SYNC_API_TOKEN: ${WISHLIST_SYNC_API_TOKEN}
      PORTAL_SSO_SHARED_SECRET: ${PORTAL_SSO_SHARED_SECRET:?Set PORTAL_SSO_SHARED_SECRET in .env}
      BDCRM_DASHBOARD_SECRET: ${BDCRM_DASHBOARD_SECRET}
      PORTAL_SSO_EXCHANGE_URL: http://company-portal-api:8004/api/portal/sso/exchange/
      # OAuth exchanges must use the same callback URL that Nexus used to
      # issue the code. Keep these in .env instead of baking in a previous LAN IP.
      NEXUS_SSO_TOKEN_URL: ${NEXUS_SSO_TOKEN_URL:-http://host.docker.internal:8005/api/sso/token/}
      NEXUS_SSO_CLIENT_ID: ${NEXUS_SSO_CLIENT_ID:-LklOUrLObOjzgvaK4CLM2uvcBP46qSr4}
      NEXUS_SSO_CLIENT_SECRET: ${NEXUS_SSO_CLIENT_SECRET:-nexus-bdcrm-direct-2026-8Vr3kN6mQp5Ls2Tx}
      NEXUS_SSO_REDIRECT_URI: ${NEXUS_SSO_REDIRECT_URI:-http://192.168.1.56:8003/}
      NEXUS_SSO_REDIRECT_URIS: ${NEXUS_SSO_REDIRECT_URIS:-http://192.168.1.56:8003/,https://vbsagent.tail9c1eb6.ts.net:6004/}
    restart: unless-stopped
    networks:
      bdcrm_net:
        aliases:
          - bdcrm-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bdcrm_frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8003}:80"
    restart: unless-stopped
    networks:
      - bdcrm_net

networks:
  bdcrm_net:
    driver: bridge



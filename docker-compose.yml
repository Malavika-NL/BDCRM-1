services:
  backend:
    build:
      context: ./BDCRM/bdcrm
      dockerfile: Dockerfile
    container_name: bdcrm_backend
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://192.168.1.94:8003,http://127.0.0.1:8003,http://localhost:8003}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://192.168.1.94:8003,http://127.0.0.1:8003,http://localhost:8003}
      # PostgreSQL is hosted on the Windows machine, not in the db service below.
      POSTGRES_DB: ${POSTGRES_DB:-BDCRM}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_NAME: ${POSTGRES_DB:-BDCRM}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${POSTGRES_HOST:-host.docker.internal}
      DATABASE_PORT: ${POSTGRES_PORT:-5433}
      CONTACTS_DATABASE_NAME: ${POSTGRES_DB:-BDCRM}
      CONTACTS_DATABASE_USER: ${POSTGRES_USER:-postgres}
      CONTACTS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CONTACTS_DATABASE_HOST: ${POSTGRES_HOST:-host.docker.internal}
      CONTACTS_DATABASE_PORT: ${POSTGRES_PORT:-5433}
      CONTACT_SYNC_SOURCE: bdcrm
      CONTACT_SYNC_TARGET_URL: ${CONTACT_SYNC_TARGET_URL:-http://192.168.1.94:8000/api/integrations/sync/contact/}
      CONTACT_SYNC_TARGET_URLS: ${CONTACT_SYNC_TARGET_URLS:-http://192.168.1.94:8000/api/integrations/sync/contact/,http://192.168.1.94:8001/api/integrations/sync/contact/}
      # Use the same value in Marketing CRM and SalesPie.
      CONTACT_SYNC_API_TOKEN: ${CONTACT_SYNC_API_TOKEN:-bdcrm-contact-sync-local}
      CONTACT_SYNC_TIMEOUT_SECONDS: ${CONTACT_SYNC_TIMEOUT_SECONDS:-5}
      WISHLIST_SYNC_API_TOKEN: ${WISHLIST_SYNC_API_TOKEN}
    restart: unless-stopped
    networks:
      - bdcrm_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bdcrm_frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8003}:80"
    restart: unless-stopped
    networks:
      - bdcrm_net

networks:
  bdcrm_net:
    driver: bridge


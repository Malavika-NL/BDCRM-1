services:
  db:
    image: postgres:16-alpine
    container_name: bdcrm_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bdcrm_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bdcrm_net

  backend:
    build:
      context: ./BDCRM/bdcrm
      dockerfile: Dockerfile
    container_name: bdcrm_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8002,http://localhost:8002}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8002,http://localhost:8002}
      POSTGRES_DB: ${POSTGRES_DB:-bdcrm_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_NAME: ${POSTGRES_DB:-bdcrm_db}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      CONTACTS_DATABASE_NAME: ${POSTGRES_DB:-bdcrm_db}
      CONTACTS_DATABASE_USER: ${POSTGRES_USER:-postgres}
      CONTACTS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CONTACTS_DATABASE_HOST: db
      CONTACTS_DATABASE_PORT: 5432
      CONTACT_SYNC_SOURCE: bdcrm
      CONTACT_SYNC_TARGET_URL: ${CONTACT_SYNC_TARGET_URL:-http://192.168.1.94:8000/api/integrations/sync/contact/}
      CONTACT_SYNC_TARGET_URLS: ${CONTACT_SYNC_TARGET_URLS:-http://192.168.1.94:8000/api/integrations/sync/contact/,http://192.168.1.94:8001/api/integrations/sync/contact/}
      CONTACT_SYNC_API_TOKEN: ${CONTACT_SYNC_API_TOKEN:-}
      CONTACT_SYNC_TIMEOUT_SECONDS: ${CONTACT_SYNC_TIMEOUT_SECONDS:-5}
    restart: unless-stopped
    networks:
      - bdcrm_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bdcrm_frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8002}:80"
    restart: unless-stopped
    networks:
      - bdcrm_net

networks:
  bdcrm_net:
    driver: bridge

volumes:
  postgres_data:

services:
  backend:
    build:
      context: ./BDCRM/bdcrm
      dockerfile: Dockerfile
    container_name: bdcrm_backend
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8002,http://localhost:8002}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8002,http://localhost:8002}
    volumes:
      - ./BDCRM/bdcrm/db.sqlite3:/app/db.sqlite3
    restart: unless-stopped
    networks:
      - bdcrm_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bdcrm_frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8002}:80"
    restart: unless-stopped
    networks:
      - bdcrm_net

networks:
  bdcrm_net:
    driver: bridge
